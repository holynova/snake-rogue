<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">蛇渊 · Snake Rogue Hero Banner</title>
  <desc id="hero-desc">Tactical dungeon crawler snake game featuring venom spitting combat, procedural chambers, line of sight fog of war, and real-time serpent mechanics.</desc>

  <defs>
    <!-- Background Gradients -->
    <radialGradient id="dungeonAmbient" cx="68%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#182333"/>
      <stop offset="45%" stop-color="#0c111e"/>
      <stop offset="100%" stop-color="#06070c"/>
    </radialGradient>

    <radialGradient id="torchLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#f77f00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d62828" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="fovVision" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fbf63" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#14261d" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#06070c" stop-opacity="0.94"/>
    </radialGradient>

    <radialGradient id="venomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="1"/>
      <stop offset="30%" stop-color="#4ade80" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#16a34a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="snakeBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="snakeHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="demonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b2e" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0d101d" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="dungeonGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#232a42" stroke-width="1" stroke-opacity="0.5"/>
      <rect x="1" y="1" width="38" height="38" fill="#101424" fill-opacity="0.45"/>
      <circle cx="20" cy="20" r="1" fill="#2a3352" fill-opacity="0.6"/>
    </pattern>

    <!-- Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Frame Base -->
  <rect width="1200" height="440" rx="16" fill="url(#dungeonAmbient)"/>
  <rect width="1200" height="440" rx="16" fill="none" stroke="#252d47" stroke-width="2"/>

  <!-- Tactical Dungeon Stage (Right Half) -->
  <g id="tactical-dungeon" transform="translate(480, 24)">
    <!-- Room Floor Surface -->
    <rect x="0" y="0" width="690" height="392" rx="12" fill="url(#dungeonGrid)"/>
    <rect x="0" y="0" width="690" height="392" rx="12" fill="none" stroke="#2b3654" stroke-width="1.5"/>

    <!-- Dungeon Walls & Pillars -->
    <!-- Top Perimeter Wall -->
    <rect x="0" y="0" width="690" height="32" rx="4" fill="#1b2033" stroke="#2e3859" stroke-width="1"/>
    <!-- Bottom Perimeter Wall -->
    <rect x="0" y="360" width="690" height="32" rx="4" fill="#1b2033" stroke="#2e3859" stroke-width="1"/>
    <!-- Interior Pillars / Obstacles -->
    <rect x="80" y="80" width="40" height="80" rx="4" fill="#181d2f" stroke="#333e61" stroke-width="1.5"/>
    <rect x="84" y="84" width="32" height="72" rx="2" fill="#121522"/>
    <rect x="360" y="80" width="80" height="40" rx="4" fill="#181d2f" stroke="#333e61" stroke-width="1.5"/>
    <rect x="364" y="84" width="72" height="32" rx="2" fill="#121522"/>
    <rect x="200" y="280" width="40" height="80" rx="4" fill="#181d2f" stroke="#333e61" stroke-width="1.5"/>

    <!-- Wall Torches with Glow -->
    <!-- Torch 1 (Top Left) -->
    <circle cx="160" cy="32" r="54" fill="url(#torchLight)"/>
    <rect x="156" y="24" width="8" height="14" rx="2" fill="#8d4925"/>
    <circle cx="160" cy="22" r="4" fill="#ffb703" filter="url(#softGlow)"/>

    <!-- Torch 2 (Top Right) -->
    <circle cx="540" cy="32" r="54" fill="url(#torchLight)"/>
    <rect x="536" y="24" width="8" height="14" rx="2" fill="#8d4925"/>
    <circle cx="540" cy="22" r="4" fill="#ffb703" filter="url(#softGlow)"/>

    <!-- Dungeon Items on Floor -->
    <!-- Apple (Heals hunger, grows body) -->
    <g transform="translate(160, 160)">
      <circle cx="0" cy="0" r="14" fill="#ef4444" stroke="#991b1b" stroke-width="2" filter="url(#softGlow)"/>
      <circle cx="-4" cy="-4" r="3" fill="#fca5a5"/>
      <path d="M 0 -13 Q 5 -20 10 -15" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">+1 LENGTH</text>
    </g>

    <!-- Golden Chest (Right Corner) -->
    <g transform="translate(600, 100)">
      <rect x="-18" y="-12" width="36" height="26" rx="4" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
      <rect x="-16" y="-8" width="32" height="4" fill="#78350f"/>
      <circle cx="0" cy="3" r="3" fill="#fde68a"/>
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">CHEST</text>
    </g>

    <!-- Stone Stairs Down -->
    <g transform="translate(600, 310)">
      <rect x="-24" y="-20" width="48" height="40" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#64748b" stroke-width="2"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#94a3b8" stroke-width="2"/>
      <line x1="-20" y1="10" x2="20" y2="10" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M 0 -2 L 5 4 L -5 4 Z" fill="#38bdf8"/>
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">▼ B08</text>
    </g>

    <!-- Fog of War Simulation (Radius 9 circular LOS from serpent head) -->
    <circle cx="280" cy="220" r="230" fill="url(#fovVision)"/>

    <!-- THE SERPENT -->
    <!-- Tail to Body Segments -->
    <!-- Segment 8 (Tail tip) -->
    <circle cx="120" cy="240" r="11" fill="url(#snakeBodyGrad)" stroke="#064e3b" stroke-width="2"/>
    <!-- Segment 7 -->
    <circle cx="140" cy="235" r="13" fill="url(#snakeBodyGrad)" stroke="#064e3b" stroke-width="2"/>
    <!-- Segment 6 -->
    <circle cx="160" cy="225" r="15" fill="url(#snakeBodyGrad)" stroke="#064e3b" stroke-width="2"/>
    <!-- Segment 5 -->
    <circle cx="178" cy="210" r="16.5" fill="url(#snakeBodyGrad)" stroke="#064e3b" stroke-width="2"/>
    <!-- Segment 4 -->
    <circle cx="198" cy="202" r="18" fill="url(#snakeBodyGrad)" stroke="#064e3b" stroke-width="2"/>
    <!-- Segment 3 -->
    <circle cx="220" cy="205" r="19" fill="url(#snakeBodyGrad)" stroke="#064e3b" stroke-width="2"/>
    <!-- Segment 2 -->
    <circle cx="242" cy="212" r="20.5" fill="url(#snakeBodyGrad)" stroke="#064e3b" stroke-width="2"/>
    <!-- Segment 1 (Neck) -->
    <circle cx="265" cy="218" r="22" fill="url(#snakeBodyGrad)" stroke="#064e3b" stroke-width="2.5"/>

    <!-- Serpent Spine Scales -->
    <path d="M 120 240 Q 180 205 265 218" fill="none" stroke="#a7f3d0" stroke-width="2.5" stroke-dasharray="4 6"/>

    <!-- Serpent Head (Facing Right) -->
    <g transform="translate(290, 220)">
      <!-- Head Base -->
      <polygon points="-8,-20 24,-12 36,0 24,12 -8,20" fill="url(#snakeHeadGrad)" stroke="#064e3b" stroke-width="2.5"/>
      <!-- Glowing Eyes -->
      <ellipse cx="14" cy="-8" rx="4.5" ry="3" fill="#facc15" stroke="#713f12" stroke-width="1" filter="url(#softGlow)"/>
      <ellipse cx="14" cy="8" rx="4.5" ry="3" fill="#facc15" stroke="#713f12" stroke-width="1" filter="url(#softGlow)"/>
      <circle cx="15" cy="-8" r="1.5" fill="#000000"/>
      <circle cx="15" cy="8" r="1.5" fill="#000000"/>
      <!-- Serpent Mouth & Forked Tongue -->
      <path d="M 36 0 L 52 0 M 52 0 L 60 -5 M 52 0 L 60 5" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
      <!-- Acid Droplets around Fangs -->
      <circle cx="34" cy="-7" r="2" fill="#86efac"/>
      <circle cx="34" cy="7" r="2" fill="#86efac"/>
    </g>

    <!-- Venom Spit Projectile (Heading from Snake Head to Enemy) -->
    <g transform="translate(360, 220)">
      <!-- Projectile Glow Halo -->
      <circle cx="40" cy="0" r="32" fill="url(#venomGlow)"/>
      <!-- Trailing Particles -->
      <circle cx="-15" cy="-2" r="3" fill="#4ade80" opacity="0.4"/>
      <circle cx="-6" cy="3" r="4.5" fill="#86efac" opacity="0.6"/>
      <circle cx="8" cy="-1" r="6" fill="#4ade80" opacity="0.8"/>
      <!-- Main Venom Core Orb -->
      <circle cx="28" cy="0" r="8.5" fill="#bbf7d0" stroke="#22c55e" stroke-width="2" filter="url(#laserGlow)"/>
      <path d="M 12 0 L 36 0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Label -->
      <text x="30" y="-18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="800" fill="#4ade80" text-anchor="middle" filter="url(#softGlow)">SPIT VENOM · 2 DMG</text>
    </g>

    <!-- Enemy: 赤甲怪 (Demon Guard) Under Attack -->
    <g transform="translate(490, 220)">
      <!-- Impact Burst Sparks -->
      <circle cx="-16" cy="0" r="26" fill="url(#venomGlow)"/>
      <path d="M -24 -12 L -8 0 L -26 12" stroke="#4ade80" stroke-width="2.5" fill="none"/>
      <!-- Demon Body -->
      <rect x="-18" y="-22" width="36" height="44" rx="8" fill="url(#demonGrad)" stroke="#7f1d1d" stroke-width="2.5"/>
      <!-- Horns -->
      <polygon points="-12,-22 -16,-34 -6,-24" fill="#450a0a" stroke="#991b1b" stroke-width="1"/>
      <polygon points="12,-22 16,-34 6,-24" fill="#450a0a" stroke="#991b1b" stroke-width="1"/>
      <!-- Glowing Eyes -->
      <circle cx="-6" cy="-8" r="3" fill="#fef08a"/>
      <circle cx="6" cy="-8" r="3" fill="#fef08a"/>
      <!-- Spikes / Armor -->
      <line x1="-18" y1="4" x2="18" y2="4" stroke="#450a0a" stroke-width="3"/>
      <!-- Health Bar Overlay -->
      <rect x="-24" y="-42" width="48" height="7" rx="3" fill="#181d2f" stroke="#333e61" stroke-width="1"/>
      <rect x="-22" y="-40.5" width="22" height="4" rx="2" fill="#ef4444"/>
      <text x="0" y="-48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">赤甲怪 2/4 HP</text>
    </g>

    <!-- Exploration Vignette Corner overlay -->
    <rect x="0" y="0" width="690" height="392" rx="12" fill="none" stroke="#222b44" stroke-width="2"/>
    <text x="670" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#475569" text-anchor="end">GRID 44×34 · FOV R=9</text>
  </g>

  <!-- Left Side: Branding, Philosophy & HUD Showcase -->
  <g id="brand-story" transform="translate(48, 40)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="320" height="28" rx="14" fill="#13241b" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="14" cy="14" r="5" fill="#34d399" filter="url(#softGlow)"/>
      <text x="28" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#6ee7b7" letter-spacing="1">TURN-BASED &amp; REAL-TIME ROGUELIKE</text>
    </g>

    <!-- Main Title Group -->
    <g transform="translate(0, 64)">
      <!-- Chinese Title -->
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="2">
        蛇 渊
      </text>
      <!-- Sub-label in title -->
      <text x="130" y="-4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#34d399" filter="url(#softGlow)">
        SNAKE ROGUE
      </text>
      <!-- English Tagline -->
      <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
        贪食蛇 × 地牢爬行 · 原生 JS ES Modules · 零依赖零构建
      </text>
    </g>

    <!-- Core Mechanics Matrix -->
    <g transform="translate(0, 148)">
      <!-- Feature Pill 1: Procedural Dungeon -->
      <g transform="translate(0, 0)">
        <rect width="186" height="34" rx="8" fill="#13192b" stroke="#253256" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#38bdf8"/>
        <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">10 层程序化深渊迷宫</text>
      </g>
      <!-- Feature Pill 2: FOV Fog of War -->
      <g transform="translate(196, 0)">
        <rect width="186" height="34" rx="8" fill="#13192b" stroke="#253256" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#a855f7"/>
        <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">半径 9 射线视线迷雾</text>
      </g>
      <!-- Feature Pill 3: Venom Spit -->
      <g transform="translate(0, 44)">
        <rect width="186" height="34" rx="8" fill="#13192b" stroke="#253256" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#4ade80"/>
        <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">三槽吐毒 · 撕咬反伤</text>
      </g>
      <!-- Feature Pill 4: Hunger Metabolism -->
      <g transform="translate(196, 44)">
        <rect width="186" height="34" rx="8" fill="#13192b" stroke="#253256" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#f59e0b"/>
        <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">饥饿代谢 · 进食成长</text>
      </g>
    </g>

    <!-- Tactical Live Status Card (HUD Replica) -->
    <g transform="translate(0, 248)">
      <rect width="382" height="108" rx="12" fill="url(#cardGrad)" stroke="#27324f" stroke-width="1.5"/>

      <!-- Card Header -->
      <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.5">DUNGEON HUD TELEMETRY</text>
      <circle cx="356" cy="20" r="4" fill="#22c55e" filter="url(#softGlow)"/>
      <text x="344" y="23" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#22c55e" text-anchor="end">LIVE 170ms/TICK</text>
      <line x1="16" y1="34" x2="366" y2="34" stroke="#1e2740" stroke-width="1"/>

      <!-- Telemetry Columns -->
      <!-- HP -->
      <g transform="translate(16, 52)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#94a3b8">HP</text>
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ef4444">♥♥♥♥♡</text>
        <text x="0" y="34" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">4 / 5</text>
      </g>

      <!-- VENOM -->
      <g transform="translate(104, 52)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#94a3b8">VENOM</text>
        <text x="0" y="18" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#4ade80">[●][●][○]</text>
        <text x="0" y="34" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">2 / 3 蓄能</text>
      </g>

      <!-- HUNGER -->
      <g transform="translate(196, 52)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#94a3b8">HUNGER</text>
        <rect x="0" y="8" width="70" height="10" rx="5" fill="#1e293b"/>
        <rect x="0" y="8" width="56" height="10" rx="5" fill="#10b981"/>
        <text x="0" y="34" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">80% 饱食</text>
      </g>

      <!-- FLOOR -->
      <g transform="translate(290, 52)">
        <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#94a3b8">DEPTH</text>
        <text x="0" y="18" font-family="ui-monospace, monospace" font-size="15" font-weight="800" fill="#facc15">B07</text>
        <text x="0" y="34" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">MAX B10</text>
      </g>
    </g>
  </g>
</svg>
