<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">蛇渊 Snake Rogue — 带视线迷雾的网格地牢贪食蛇</title>
  <desc id="desc">深色地牢底标题：蛇渊，副标题一条会法术的蛇，一座会咬人的地牢；右侧是一圈视野光晕，绿蛇在光晕里游动，光晕外是迷雾与一只毒蛛的影子。</desc>

  <rect width="1200" height="360" rx="26" fill="#07070c"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#7f8499">网格地牢贪食蛇 · GRID SNAKE DUNGEON</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#e8ecf4">蛇渊</text>
    <text x="56" y="168" font-size="23" fill="#e8c15a">SNAKE ROGUE — 一条会法术的蛇，一座会咬人的地牢</text>
    <text x="56" y="204" font-size="19" fill="#b9bdc9">视线迷雾里移动、进食、喷吐毒液，下潜 10 层寻圣物。</text>
    <g id="chips" font-size="18" fill="#e8ecf4" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#14141f" stroke="#2a2d44" stroke-width="1.5"/><text x="119" y="262">10 层地牢</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#14141f" stroke="#2a2d44" stroke-width="1.5"/><text x="257" y="262">4 种敌人</text></g>
      <g><rect x="332" y="238" width="168" height="36" rx="18" fill="#14141f" stroke="#2a2d44" stroke-width="1.5"/><text x="416" y="262">毒液 + 饱食度</text></g>
      <g><rect x="512" y="238" width="168" height="36" rx="18" fill="#14141f" stroke="#2a2d44" stroke-width="1.5"/><text x="596" y="262">零依赖无构建</text></g>
    </g>
  </g>

  <g id="fov-diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="fog">
      <circle cx="950" cy="168" r="132" fill="#14141f"/>
      <circle cx="950" cy="168" r="132" fill="none" stroke="#2a2d44" stroke-width="2"/>
    </g>
    <g id="floor-grid" stroke="#23263a" stroke-width="1.5">
      <line x1="858" y1="60" x2="858" y2="276"/>
      <line x1="904" y1="48" x2="904" y2="288"/>
      <line x1="950" y1="40" x2="950" y2="296"/>
      <line x1="996" y1="48" x2="996" y2="288"/>
      <line x1="1042" y1="60" x2="1042" y2="276"/>
      <line x1="836" y1="76" x2="1064" y2="76"/>
      <line x1="824" y1="122" x2="1076" y2="122"/>
      <line x1="818" y1="168" x2="1082" y2="168"/>
      <line x1="824" y1="214" x2="1076" y2="214"/>
      <line x1="836" y1="260" x2="1064" y2="260"/>
    </g>
    <g id="snake">
      <circle cx="884" cy="214" r="15" fill="#2e8a45"/>
      <circle cx="912" cy="196" r="16" fill="#4fbf63"/>
      <circle cx="938" cy="176" r="17" fill="#4fbf63"/>
      <circle cx="962" cy="152" r="19" fill="#63d878" stroke="#123a1e" stroke-width="2"/>
      <circle cx="956" cy="146" r="3.5" fill="#07070c"/>
      <circle cx="970" cy="146" r="3.5" fill="#07070c"/>
      <path d="M 962 170 L 962 180 M 957 180 L 962 174 L 967 180" stroke="#e04848" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <g id="apple">
      <circle cx="1006" cy="122" r="11" fill="#e04848"/>
      <line x1="1006" y1="111" x2="1010" y2="103" stroke="#4fbf63" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="spider-shadow" opacity="0.55">
      <circle cx="1078" cy="238" r="12" fill="#3a3f5c"/>
      <g stroke="#3a3f5c" stroke-width="2.5" stroke-linecap="round">
        <line x1="1068" y1="230" x2="1058" y2="222"/>
        <line x1="1088" y1="230" x2="1098" y2="222"/>
        <line x1="1068" y1="246" x2="1058" y2="254"/>
        <line x1="1088" y1="246" x2="1098" y2="254"/>
      </g>
    </g>
    <g id="venom-dots" fill="#7ad67a">
      <circle cx="984" cy="196" r="6"/>
      <circle cx="998" cy="208" r="6"/>
      <circle cx="1012" cy="220" r="6"/>
    </g>
    <text x="950" y="330" font-size="18" fill="#7f8499" text-anchor="middle">视野半径 9 格 · 迷雾之外不可见</text>
  </g>
</svg>
