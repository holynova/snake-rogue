<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蛇渊 · Snake Rogue</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="720"></canvas>
  <div id="loading">加载中…</div>
</div>
<div id="touch-ui">
  <button id="touch-start" type="button">开始</button>
  <button id="touch-spit" type="button">吐毒液</button>
  <button id="touch-pause" type="button">暂停</button>
  <button id="touch-restart" type="button">再来一局</button>
  <button id="touch-title" type="button">回标题</button>
</div>
<a id="repo-link" href="https://github.com/holynova/snake-rogue" target="_blank" rel="noopener">GitHub / holynova/snake-rogue</a>
<script type="module" src="src/main.js"></script>
</body>
</html>
